<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="t d">
  <title id="t">skillDB</title>
  <desc id="d">skillDB, a privacy-first career vault in your browser. A job description and your profile become a tailored LaTeX resume, shown as a LaTeX source fragment beside the rendered resume lines.</desc>
  <rect width="1200" height="400" rx="26" fill="#f4f7fd"/>
  <rect x="0.5" y="0.5" width="1199" height="399" rx="25.5" fill="none" stroke="#d3def3"/>
  <g transform="translate(64 64)">
    <text font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16" letter-spacing="3" fill="#5b6f94">CAREER VAULT · LOCAL · BYO AI KEY</text>
    <text y="96" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="88" font-weight="800" fill="#141414" letter-spacing="-3">skill<tspan fill="#2563EB">DB</tspan></text>
    <text y="154" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="28" fill="#33415c">Your career, stored in your browser.</text>
    <text y="192" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="28" fill="#33415c">Paste a job description.</text>
    <text y="230" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="28" font-weight="700" fill="#2563EB">Get a tailored LaTeX resume.</text>
    <text y="286" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16" fill="#5b6f94">Gemini · OpenAI · Anthropic · Groq</text>
  </g>
  <g transform="translate(600 40)">
    <rect width="260" height="320" rx="14" fill="#141a26"/>
    <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13">
      <text x="18" y="34" fill="#7f93b8">main.tex</text>
      <text x="18" y="68" fill="#60a5fa">\section{</text><text x="86" y="68" fill="#e6edf3">Experience}</text>
      <text x="18" y="94" fill="#60a5fa">\resumeItem{</text>
      <text x="34" y="116" fill="#e6edf3">Tailored to the</text>
      <text x="34" y="138" fill="#e6edf3">job description</text>
      <text x="18" y="160" fill="#60a5fa">}</text>
      <text x="18" y="196" fill="#60a5fa">\section{</text><text x="86" y="196" fill="#e6edf3">Projects}</text>
      <text x="18" y="222" fill="#60a5fa">\resumeItem{ … }</text>
    </g>
    <path d="M262 160 H296" stroke="#2563EB" stroke-width="4" stroke-linecap="round"/>
    <path d="M288 150 L300 160 L288 170" fill="none" stroke="#2563EB" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g transform="translate(920 40)">
    <rect width="216" height="320" rx="6" fill="#ffffff" stroke="#d3def3"/>
    <rect x="22" y="26" width="110" height="12" rx="3" fill="#141414"/>
    <rect x="22" y="48" width="150" height="6" rx="3" fill="#9fb0cf"/>
    <rect x="22" y="80" width="70" height="8" rx="3" fill="#2563EB"/><path d="M22 94 H194" stroke="#2563EB"/>
    <g fill="#c4cfe4"><rect x="22" y="108" width="170" height="6" rx="3"/><rect x="22" y="122" width="150" height="6" rx="3"/><rect x="22" y="136" width="160" height="6" rx="3"/></g>
    <rect x="22" y="168" width="60" height="8" rx="3" fill="#2563EB"/><path d="M22 182 H194" stroke="#2563EB"/>
    <g fill="#c4cfe4"><rect x="22" y="196" width="160" height="6" rx="3"/><rect x="22" y="210" width="140" height="6" rx="3"/><rect x="22" y="224" width="165" height="6" rx="3"/></g>
    <text x="108" y="302" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#5b6f94">A4 PDF · illustrative</text>
  </g>
